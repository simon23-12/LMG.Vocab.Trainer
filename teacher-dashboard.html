

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMG Vokabeltrainer - Lehrer Dashboard</title>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FFFFFF" id="theme-color">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LMG Vocab">
  <link rel="apple-touch-icon" href="/images/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icons/icon-192.png">
  
  <style>
    :root {
      --bg-gradient-start: #667eea;
      --bg-gradient-end: #764ba2;
      --container-bg: white;
      --text-primary: #333;
      --text-secondary: #666;
      --text-tertiary: #999;
      --border-color: #ddd;
      --input-bg: white;
      --input-border: #ddd;
      --button-primary: #667eea;
      --button-hover: #5568d3;
      --card-bg: white;
      --shadow-color: rgba(0,0,0,0.1);
      --heat-0: #ebedf0;
      --heat-1: #9be9a8;
      --heat-2: #40c463;
      --heat-3: #30a14e;
      --heat-4: #216e39;
      --heat-grid-border: rgba(27,31,35,0.06);
    }

    body.dark-mode {
      --heat-0: #1c2333;
      --heat-1: #0e4429;
      --heat-2: #006d32;
      --heat-3: #26a641;
      --heat-4: #39d353;
      --heat-grid-border: rgba(255,255,255,0.05);
      --bg-gradient-start: #1a1a2e;
      --bg-gradient-end: #16213e;
      --container-bg: #0f3460;
      --text-primary: #e0e0e0;
      --text-secondary: #b0b0b0;
      --text-tertiary: #808080;
      --border-color: #2a2a3e;
      --input-bg: #1a1a2e;
      --input-border: #2a2a3e;
      --button-primary: #667eea;
      --button-hover: #5568d3;
      --card-bg: #16213e;
      --shadow-color: rgba(0,0,0,0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      min-height: 100vh;
      padding: 20px;
      transition: background 0.3s ease;
    }
    
    .dark-mode-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 30px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255,255,255,0.3);
      transition: 0.3s;
      border-radius: 30px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .toggle-slider:before {
      position: absolute;
      content: "☀️";
      height: 22px;
      width: 22px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    input:checked + .toggle-slider {
      background-color: #667eea;
    }

    input:checked + .toggle-slider:before {
      transform: translateX(30px);
      content: "🌙";
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--container-bg);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px var(--shadow-color);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    
    h1 { 
      color: var(--button-primary); 
      margin-bottom: 10px;
      text-align: center;
      font-size: 2.5em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    
    h2 {
      color: var(--text-primary);
      margin: 30px 0 20px 0;
      font-size: 1.8em;
    }
    
    h3 {
      color: var(--button-primary);
      margin-bottom: 20px;
    }
    
    .logo {
      height: 60px;
      width: auto;
    }
    
    .form-group {
      margin: 20px 0;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    
    select {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      border: 2px solid var(--input-border);
      border-radius: 8px;
      font-size: 16px;
      transition: border 0.3s, background 0.3s;
      background: var(--input-bg);
      color: var(--text-primary);
    }
    
    select:focus {
      outline: none;
      border-color: var(--button-primary);
    }
    
    button {
      padding: 12px 30px;
      background: var(--button-primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
      transition: all 0.3s;
    }
    
    button:hover {
      background: var(--button-hover);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102,126,234,0.4);
    }
    
    button.logout-btn {
      background: #e74c3c;
    }
    
    button.logout-btn:hover {
      background: #c0392b;
    }
    
    /* ---- Aktivitaets-Heatmap (Schuljahr) ---- */
    .heatmap-box {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      background: var(--card-bg);
      overflow-x: auto;
    }

    .heatmap-facts {
      display: flex;
      flex-wrap: wrap;
      gap: 26px;
      margin-bottom: 16px;
    }

    .heatmap-facts div span {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .heatmap-facts div b {
      font-size: 22px;
      color: var(--text-primary);
    }

    .heatmap-scroll { display: flex; gap: 6px; min-width: max-content; }

    .heatmap-daylabels {
      display: grid;
      grid-template-rows: repeat(7, 13px);
      gap: 3px;
      margin-top: 18px;
      font-size: 10px;
      color: var(--text-tertiary);
    }

    .heatmap-daylabels span { line-height: 13px; }

    .heatmap-months {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 13px;
      gap: 3px;
      height: 18px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .heatmap-grid {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 13px;
      grid-template-rows: repeat(7, 13px);
      gap: 3px;
    }

    /* Monatsnamen sind breiter als eine Spalte - sie duerfen ueberstehen. */
    .heatmap-months span { white-space: nowrap; overflow: visible; }

    .heat-day {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      background: var(--heat-0);
      outline: 1px solid var(--heat-grid-border);
      outline-offset: -1px;
    }

    .heat-day.l1 { background: var(--heat-1); }
    .heat-day.l2 { background: var(--heat-2); }
    .heat-day.l3 { background: var(--heat-3); }
    .heat-day.l4 { background: var(--heat-4); }
    .heat-day.outside { background: transparent; outline: none; }
    .heat-day.future { opacity: 0.45; }

    .heatmap-legend {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .heatmap-note {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-tertiary);
      line-height: 1.5;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .summary-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    
    .summary-card div:first-child {
      font-size: 0.9em;
      opacity: 0.9;
    }
    
    .summary-card div:last-child {
      font-size: 2.5em;
      font-weight: bold;
      margin: 10px 0;
    }
    
    .student-card {
      padding: 15px;
      margin: 10px 0;
      background: var(--card-bg);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      border-left: 4px solid var(--button-primary);
      box-shadow: 0 2px 8px var(--shadow-color);
    }
    
    .student-card:hover {
      transform: translateX(5px);
      box-shadow: 0 4px 12px var(--shadow-color);
    }
    
    .student-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .student-perf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }
    
    .perf-item {
      padding: 10px;
      background: var(--input-bg);
      border-radius: 8px;
      text-align: center;
      border: 2px solid var(--border-color);
      transition: background 0.3s ease;
    }
    
    .perf-item.green { 
      border-color: #56ab2f; 
      background: #d4edda; 
      color: #155724;
    }
    
    .perf-item.yellow { 
      border-color: #f09819; 
      background: #fff3cd; 
      color: #856404;
    }
    
    .perf-item.red { 
      border-color: #eb3349; 
      background: #f8d7da; 
      color: #721c24;
    }
    
    .status {
      padding: 12px;
      margin: 15px 0;
      border-radius: 8px;
      text-align: center;
      font-weight: 500;
      display: none;
    }
    
    .status.error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
      display: block;
    }
    
    .status.success {
      background: #efe;
      color: #3a3;
      border: 1px solid #cfc;
      display: block;
    }
    
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      display: block;
    }
    
    .header-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    
    .welcome-text {
      font-size: 1.1em;
      color: var(--text-secondary);
    }
    
    .footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      font-size: 12px;
      color: var(--text-tertiary);
      font-style: italic;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 20px;
      color: var(--button-primary);
    }
  </style>
</head>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>

  <script>
  // Firebase Konfiguration
  const firebaseConfig = {
    apiKey: "AIzaSyBRPlWh1slILKg8DWQDOEWXSFsnUK3j1vw",
    authDomain: "testdatabase-4daf4.firebaseapp.com",
    databaseURL: "https://testdatabase-4daf4-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "testdatabase-4daf4",
    storageBucket: "testdatabase-4daf4.firebasestorage.app",
    messagingSenderId: "743231387214",
    appId: "1:743231387214:web:166169b25f72616280351f"
  };

  // Firebase initialisieren
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Auth-Check beim Laden
  //
  // Das Lehrer-Recht steckt als Custom Claim (admin: true) im Firebase-Token und wird
  // serverseitig von den Security Rules geprueft - es laesst sich nicht mehr durch
  // Setzen eines sessionStorage-Flags vortaeuschen. Vergeben wird es mit
  // "node admin/set-admin.mjs <loginName>".
  window.addEventListener('DOMContentLoaded', async () => {
    const session = await lmgRequireAuth({ admin: true });
    console.log('Lehrer-Zugang bestätigt:', session.loginName);
    loadAdminStats();
    loadActivityHeatmap();
    initDarkMode();
  });

  // Status-Anzeige
  function showStatus(message, type) {
    const statusEl = document.getElementById('status');
    statusEl.textContent = message;
    statusEl.className = 'status ' + type;
    setTimeout(() => {
      statusEl.className = 'status';
    }, 4000);
  }

  // ===================== Aktivitaets-Heatmap =====================
  // Liest NUR stats/daily (reine Tagessummen, keine Personendaten).
  // Fenster = Schuljahr; liegen aeltere Tage vor (z. B. die hochgerechneten
  // Sommerwochen), wird der Anfang automatisch dorthin verlaengert.
  const SCHULJAHR = { start: '2026-09-01', ende: '2027-07-31', label: '2026/27' };

  const MONATE_KURZ = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];

  function heatParse(s) {           // 'YYYY-MM-DD' -> Date (UTC, sommerzeitfest)
    const [y, m, d] = s.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d));
  }

  function heatKey(d) {
    const p = n => String(n).padStart(2, '0');
    return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate());
  }

  function heatAddDays(d, n) {
    const c = new Date(d.getTime());
    c.setUTCDate(c.getUTCDate() + n);
    return c;
  }

  function heatLangesDatum(d) {
    return d.toLocaleDateString('de-DE', {
      weekday: 'short', day: '2-digit', month: 'long', year: 'numeric', timeZone: 'UTC'
    });
  }

  // Schwellen aus den Quartilen der Tage mit Aktivitaet - feste Grenzen waeren
  // je nach Klassengroesse entweder immer blass oder immer dunkelgruen.
  function heatSchwellen(werte) {
    const sortiert = werte.slice().sort((a, b) => a - b);
    const q = f => sortiert[Math.min(sortiert.length - 1, Math.floor(sortiert.length * f))];
    let t = [q(0.25), q(0.5), q(0.75)];
    for (let i = 1; i < t.length; i++) if (t[i] <= t[i - 1]) t[i] = t[i - 1] + 1;
    return t;
  }

  async function loadActivityHeatmap() {
    const grid = document.getElementById('heatGrid');
    const monate = document.getElementById('heatMonths');
    const note = document.getElementById('heatNote');
    if (!grid) return;

    let daily = {}, meta = {};
    try {
      const snap = await db.ref('stats').get();
      const val = snap.val() || {};
      daily = val.daily || {};
      meta = val.meta || {};
    } catch (error) {
      console.error('Fehler beim Laden der Heatmap-Daten:', error);
      note.textContent = 'Aktivitätsdaten konnten nicht geladen werden.';
      return;
    }

    // Fenster bestimmen
    const vorhandene = Object.keys(daily).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
    const fruehester = vorhandene.length ? vorhandene[0] : null;
    const heuteKey = heatKey(new Date(Date.now() - new Date().getTimezoneOffset() * 60000));
    const vonKey = (fruehester && fruehester < SCHULJAHR.start) ? fruehester : SCHULJAHR.start;
    const bisKey = heuteKey > SCHULJAHR.ende ? heuteKey : SCHULJAHR.ende;

    document.getElementById('heatmapYearLabel').textContent =
      vonKey < SCHULJAHR.start
        ? 'seit ' + heatParse(vonKey).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'UTC' })
        : 'Schuljahr ' + SCHULJAHR.label;

    // Raster immer bei Montag beginnen und bei Sonntag enden
    const von = heatParse(vonKey), bis = heatParse(bisKey);
    const gridVon = heatAddDays(von, -((von.getUTCDay() + 6) % 7));
    const gridBis = heatAddDays(bis, 6 - ((bis.getUTCDay() + 6) % 7));

    // Werte einsammeln
    const werte = [];
    for (let d = new Date(von.getTime()); d <= bis; d = heatAddDays(d, 1)) {
      const e = daily[heatKey(d)];
      const v = (e && Number(e.vocabs)) || 0;
      if (v > 0) werte.push(v);
    }
    const schwellen = werte.length ? heatSchwellen(werte) : [1, 2, 3];
    const gesamt = werte.reduce((a, b) => a + b, 0);
    const bester = werte.length ? Math.max.apply(null, werte) : 0;

    document.getElementById('heatTotal').textContent = gesamt.toLocaleString('de-DE');
    document.getElementById('heatBest').textContent = bester.toLocaleString('de-DE');
    document.getElementById('heatActiveDays').textContent = werte.length;
    document.getElementById('heatAvg').textContent =
      werte.length ? Math.round(gesamt / werte.length).toLocaleString('de-DE') : '-';

    // Raster zeichnen
    const geschaetztBis = meta.estimatedUntil || null;
    const zellen = [];
    const monatsSpalten = [];
    let letzterMonat = -1;

    for (let d = new Date(gridVon.getTime()); d <= gridBis; d = heatAddDays(d, 1)) {
      const key = heatKey(d);
      const wochentag = (d.getUTCDay() + 6) % 7;

      // Monatsbeschriftung: einmal pro Monat ueber der ersten Spalte des Monats
      if (wochentag === 0) {
        const m = d.getUTCMonth();
        const zeigen = m !== letzterMonat && key >= vonKey;
        monatsSpalten.push('<span>' + (zeigen ? MONATE_KURZ[m] : '') + '</span>');
        if (zeigen) letzterMonat = m;
      }

      if (key < vonKey || key > bisKey) {
        zellen.push('<div class="heat-day outside"></div>');
        continue;
      }

      const eintrag = daily[key] || {};
      const vokabeln = Number(eintrag.vocabs) || 0;
      const runden = Number(eintrag.sessions) || 0;
      const geschaetzt = geschaetztBis && key <= geschaetztBis && vokabeln > 0;
      const zukunft = key > heuteKey;

      let stufe = 0;
      if (vokabeln > 0) {
        stufe = vokabeln <= schwellen[0] ? 1 : vokabeln <= schwellen[1] ? 2 : vokabeln <= schwellen[2] ? 3 : 4;
      }

      // Tage, die noch kommen, bekommen bewusst keinen Tooltip - "keine Übung"
      // waere dort irrefuehrend.
      const tooltip = zukunft ? '' : heatLangesDatum(d) + ': ' +
        (vokabeln ? vokabeln.toLocaleString('de-DE') + ' Vokabeln' : 'keine Übung') +
        (runden ? ' · ' + runden + (runden === 1 ? ' Runde' : ' Runden') : '') +
        (geschaetzt ? ' (hochgerechnet)' : '');

      zellen.push('<div class="heat-day' + (stufe ? ' l' + stufe : '') +
        (zukunft ? ' future' : '') +
        (tooltip ? '" title="' + tooltip : '') + '"></div>');
    }

    monate.innerHTML = monatsSpalten.join('');
    grid.innerHTML = zellen.join('');

    // Hinweistext (die Herkunft der Septemberzahlen erklaert die Lehrkraft muendlich)
    note.textContent = 'Anonyme Gesamtzahlen über alle Trainer (Vokabeltrainer, Monti-Game, Irregular Verbs, Battlearena) – keine Zuordnung zu Schülern oder Klassen.';

    // Direkt zur aktuellen Woche scrollen statt ans Schuljahresende
    const box = grid.closest('.heatmap-box');
    if (box) {
      const spaltenBreite = 16; // 13px Feld + 3px Abstand
      const wochenBisHeute = Math.floor((heatParse(heuteKey) - gridVon) / 604800000);
      box.scrollLeft = Math.max(0, (wochenBisHeute + 2) * spaltenBreite - box.clientWidth);
    }
  }

  // Lade Admin-Statistiken (aus users/ aggregiert - keine usage_logs mehr)
  async function loadAdminStats() {
    try {
      const usersSnapshot = await db.ref('users').get();
      
      if (!usersSnapshot.exists()) {
        document.getElementById('adminTotalSessions').textContent = '0';
        document.getElementById('adminTotalVocabs').textContent = '0';
        document.getElementById('adminActiveStudents').textContent = '0';
        document.getElementById('adminAvgAccuracy').textContent = '-';
        return;
      }
      
      const users = usersSnapshot.val();
      
      let activeStudents = 0;
      let totalVocabs = 0;
      let totalSessions = 0;  // Zähle getestete Seiten als "Sessions"
      let totalAccuracySum = 0;
      let accuracyCount = 0;
      
      for (let userKey in users) {
        const user = users[userKey];
        
        // Überspringe User ohne Namen (Test-Einträge)
        if (!user.name) continue;
        
        activeStudents++;
        
        // lifetimeTotalVocabs = Gesamtzahl geübter Vokabeln
        totalVocabs += (user.lifetimeTotalVocabs || 0);
        
        // Performance-Einträge durchgehen für Sessions und Accuracy
        const performance = user.performance || {};
        for (let perfKey in performance) {
          const perf = performance[perfKey];
          
          // Jeder Performance-Eintrag = eine "Session"
          totalSessions++;
          
          // Accuracy sammeln - mit strikter Validierung
          if (perf && typeof perf.percent === 'number' && !isNaN(perf.percent) && perf.percent >= 0 && perf.percent <= 100) {
            totalAccuracySum += perf.percent;
            accuracyCount++;
          }
        }
        
        // Irregular Verbs auch zählen (falls vorhanden)
        if (user.irregularVerbsSimple) {
          totalSessions++;
          if (user.irregularVerbsSimple.percent !== undefined) {
            totalAccuracySum += user.irregularVerbsSimple.percent;
            accuracyCount++;
          }
        }
        if (user.irregularVerbsFull) {
          totalSessions++;
          if (user.irregularVerbsFull.percent !== undefined) {
            totalAccuracySum += user.irregularVerbsFull.percent;
            accuracyCount++;
          }
        }
      }
      
      const avgAccuracy = accuracyCount > 0 ? Math.round(totalAccuracySum / accuracyCount) : 0;
      
      // DEBUG Logging
      console.log('=== ACCURACY DEBUG ===');
      console.log('Total Accuracy Sum:', totalAccuracySum);
      console.log('Accuracy Count:', accuracyCount);
      console.log('Average Accuracy:', avgAccuracy);
      console.log('Total Sessions:', totalSessions);
      console.log('Active Students:', activeStudents);
      
      // Update UI
      document.getElementById('adminTotalSessions').textContent = totalSessions.toLocaleString('de-DE');
      document.getElementById('adminTotalVocabs').textContent = totalVocabs.toLocaleString('de-DE');
      document.getElementById('adminActiveStudents').textContent = activeStudents;
      document.getElementById('adminAvgAccuracy').textContent = avgAccuracy > 0 ? avgAccuracy + '%' : '-';
      
      console.log('✓ Admin Stats geladen (aus users/):', { totalSessions, totalVocabs, activeStudents, avgAccuracy });
      
    } catch (error) {
      console.error('Fehler beim Laden der Admin Stats:', error);
    }
  }

  // Show Status Message
  function showStatus(msg, type) {
    console.log(msg);
  }

  async function loadClassPerformance() {
    const selectedClass = document.getElementById('adminClassSelect').value;
    if (!selectedClass) {
      document.getElementById('studentList').innerHTML = '';
      document.getElementById('sortControls').style.display = 'none';
      return;
    }
    
    try {
      showStatus("Lade Schüler von Klasse " + selectedClass + "...", 'info');
      
      const snap = await db.ref('users').get();
      if (!snap.exists()) {
        document.getElementById('studentList').innerHTML = '<p style="color: var(--text-secondary);">Keine Schüler gefunden.</p>';
        return;
      }
      
      const allUsers = snap.val();
      const studentsInClass = [];
      
      for (let userKey in allUsers) {
        const user = allUsers[userKey];
        if (user.class === selectedClass) {
          const perf = user.performance || {};
          const vocabCount = Object.keys(perf).filter(k => k.startsWith('page_') || k.startsWith('interval_')).length;
          studentsInClass.push({
            userKey: userKey,
            displayName: user.loginName || user.name || userKey,   // nur der Login, nie der Klarname
            vocabCount: vocabCount,
            dataLoaded: false
          });
        }
      }

      if (studentsInClass.length === 0) {
        document.getElementById('studentList').innerHTML = '<p style="color: var(--text-secondary);">Keine Schüler in dieser Klasse gefunden.</p>';
        document.getElementById('sortControls').style.display = 'none';
        return;
      }

      currentStudents = studentsInClass;
      document.getElementById('sortControls').style.display = 'block';
      document.getElementById('studentSortSelect').value = 'name';
      renderStudentList();
      showStatus("✓ " + studentsInClass.length + " Schüler gefunden", 'success');
      
    } catch (error) {
      showStatus("Fehler: " + error.message, 'error');
      console.error(error);
    }
  }

  function renderStudentList() {
    const sortBy = document.getElementById('studentSortSelect').value;
    const sorted = [...currentStudents].sort((a, b) => {
      if (sortBy === 'vocab') return b.vocabCount - a.vocabCount;
      return a.displayName.localeCompare(b.displayName);
    });
    const selectedClass = document.getElementById('adminClassSelect').value;
    let html = '<h3>Schüler in Klasse ' + selectedClass + ':</h3>';
    sorted.forEach((student, index) => {
      const studentId = 'student_' + index;
      const vocabHint = sortBy === 'vocab' ? ` · ${student.vocabCount} Einheiten geübt` : '';
      html += `
        <div class="student-card" onclick="loadAndToggleStudentPerf('${student.userKey}', '${studentId}')">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <div class="student-name">${student.displayName}</div>
              <div id="${studentId}_summary" style="font-size: 14px; color: var(--text-secondary); margin-top: 5px;">
                Klicken zum Laden...${vocabHint}
              </div>
            </div>
            <div id="${studentId}_icon" style="font-size: 20px; transition: transform 0.3s;">▼</div>
          </div>
          <div id="${studentId}_perf" class="student-perf-grid" style="display: none; margin-top: 15px;">
            <div style="text-align: center; color: var(--text-secondary);">Lade Daten...</div>
          </div>
        </div>
      `;
    });
    document.getElementById('studentList').innerHTML = html;
  }

  // Lazy Load Student Performance
  const loadedStudents = {};
  let currentStudents = [];
  
  async function loadAndToggleStudentPerf(userKey, studentId) {
    const perfDiv = document.getElementById(studentId + '_perf');
    const icon = document.getElementById(studentId + '_icon');
    const summary = document.getElementById(studentId + '_summary');
    
    if (!perfDiv) return;
    
    if (perfDiv.style.display === 'grid') {
      perfDiv.style.display = 'none';
      icon.style.transform = 'rotate(0deg)';
      return;
    }
    
    if (!loadedStudents[userKey]) {
      try {
        perfDiv.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 20px;">Lade Daten...</div>';
        perfDiv.style.display = 'grid';
        icon.style.transform = 'rotate(180deg)';
        
        const userSnap = await db.ref('users/' + userKey).get();
        if (!userSnap.exists()) {
          perfDiv.innerHTML = '<div style="text-align: center; color: var(--text-secondary);">Keine Daten gefunden</div>';
          summary.textContent = 'Keine Daten';
          return;
        }
        
        const userData = userSnap.val();
        
        console.log('=== USER DATA DEBUG ===');
        console.log('UserKey:', userKey);
        console.log('Has performance object:', !!userData.performance);
        
        let pageCount = 0;
        let intervalCount = 0;
        const allPerformance = {};
        
        // Performance ist in einem Sub-Objekt!
        const performanceData = userData.performance || {};
        
        for (let key in performanceData) {
          if (key.startsWith('page_')) {
            console.log('Found page:', key);
            pageCount++;
            allPerformance[key] = performanceData[key];
          } else if (key.startsWith('interval_')) {
            console.log('Found interval:', key);
            intervalCount++;
            allPerformance[key] = performanceData[key];
          }
        }
        
        console.log('Page count:', pageCount);
        console.log('Interval count:', intervalCount);
        
        const irregularSimple = userData.irregularVerbsSimple;
        const irregularFull = userData.irregularVerbsFull;
        
        let perfHtml = '';
        
        // ERST: Vocabulary Performance
        if (Object.keys(allPerformance).length > 0) {
          const sorted = Object.entries(allPerformance).sort((a, b) => {
            const pageA = parseInt(a[0].replace(/\D/g, ''));
            const pageB = parseInt(b[0].replace(/\D/g, ''));
            return pageA - pageB;
          });
          
          sorted.forEach(([key, data]) => {
            const pageNum = key.replace('page_', '').replace('interval_', 'I: ');
            let colorClass = '';
            if (data.percent >= 80) colorClass = 'green';
            else if (data.percent >= 50) colorClass = 'yellow';
            else colorClass = 'red';
            
            perfHtml += `
              <div class="perf-item ${colorClass}">
                <div style="font-weight: bold; font-size: 16px;">${pageNum}</div>
                <div style="font-size: 20px; margin: 5px 0;">${data.percent}%</div>
                <div style="font-size: 12px;">${data.score}/${data.total}</div>
                <div style="font-size: 11px; opacity: 0.7;">${data.date || ''}</div>
              </div>
            `;
          });
        }
        
        // DANN: Irregular Verbs (am Ende)
        if (irregularSimple || irregularFull) {
          perfHtml += '<div style="grid-column: 1 / -1; background: linear-gradient(135deg, #9D50BB 0%, #6E48AA 100%); color: white; padding: 15px; border-radius: 8px; margin-top: 10px;">';
          perfHtml += '<div style="font-weight: bold; font-size: 16px; margin-bottom: 10px;">📚 Irregular Verbs</div>';
          perfHtml += '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">';
          
          let overallAcc = '--';
          if (irregularSimple && irregularFull) {
            overallAcc = Math.round((irregularSimple.percent + irregularFull.percent) / 2);
          } else if (irregularSimple) {
            overallAcc = irregularSimple.percent;
          } else if (irregularFull) {
            overallAcc = irregularFull.percent;
          }
          
          perfHtml += `<div style="background: rgba(255,255,255,0.2); padding: 10px; border-radius: 6px; text-align: center;">
            <div style="font-size: 12px; opacity: 0.9;">Overall</div>
            <div style="font-size: 24px; font-weight: bold;">${overallAcc}%</div>
          </div>`;
          
          let simplePastAcc = '--';
          const simplePastScores = [];
          if (irregularSimple && irregularSimple.simplePastAccuracy !== undefined) {
            simplePastScores.push(irregularSimple.simplePastAccuracy);
          }
          if (irregularFull && irregularFull.simplePastAccuracy !== undefined) {
            simplePastScores.push(irregularFull.simplePastAccuracy);
          }
          if (simplePastScores.length > 0) {
            simplePastAcc = Math.round(simplePastScores.reduce((a, b) => a + b, 0) / simplePastScores.length);
          }
          
          perfHtml += `<div style="background: rgba(255,255,255,0.2); padding: 10px; border-radius: 6px; text-align: center;">
            <div style="font-size: 12px; opacity: 0.9;">Simple Past</div>
            <div style="font-size: 24px; font-weight: bold;">${simplePastAcc}%</div>
          </div>`;
          
          let pastPartAcc = '--';
          if (irregularFull && irregularFull.pastParticipleAccuracy !== undefined && irregularFull.pastParticipleAccuracy !== null) {
            pastPartAcc = irregularFull.pastParticipleAccuracy;
          }
          
          perfHtml += `<div style="background: rgba(255,255,255,0.2); padding: 10px; border-radius: 6px; text-align: center;">
            <div style="font-size: 12px; opacity: 0.9;">Past Participle</div>
            <div style="font-size: 24px; font-weight: bold;">${pastPartAcc}%</div>
          </div>`;
          
          perfHtml += '</div></div>';
        }
        
        if (perfHtml === '') {
          perfHtml = '<div style="text-align: center; color: var(--text-secondary); padding: 20px;">Noch keine Tests absolviert</div>';
        }
        
        perfDiv.innerHTML = perfHtml;
        
        const totalTests = pageCount + intervalCount;
        const irrVerbsText = (irregularSimple || irregularFull) ? ' • Irregular Verbs ✓' : '';
        summary.textContent = totalTests + ' Seite' + (totalTests !== 1 ? 'n' : '') + ' getestet' + irrVerbsText;
        
        loadedStudents[userKey] = true;
        
      } catch (error) {
        console.error('Error loading student data:', error);
        perfDiv.innerHTML = '<div style="text-align: center; color: #e74c3c; padding: 20px;">Fehler beim Laden: ' + error.message + '</div>';
      }
    } else {
      perfDiv.style.display = 'grid';
      icon.style.transform = 'rotate(180deg)';
    }
  }

  function logout() {
    lmgLogout();

  function initDarkMode() {
    const darkModeToggle = document.getElementById('darkModeToggle');
    const themeColor = document.querySelector('meta[name="theme-color"]');
    const isDarkMode = localStorage.getItem('darkMode') === 'true';
    
    if (isDarkMode) {
      document.body.classList.add('dark-mode');
      darkModeToggle.checked = true;
      themeColor.setAttribute('content', '#0f3460'); // Dark-Mode Farbe
    }
    
    darkModeToggle.addEventListener('change', function() {
      if (this.checked) {
        document.body.classList.add('dark-mode');
        localStorage.setItem('darkMode', 'true');
        themeColor.setAttribute('content', '#0f3460'); // Dark-Mode Farbe
      } else {
        document.body.classList.remove('dark-mode');
        localStorage.setItem('darkMode', 'false');
        themeColor.setAttribute('content', '#FFFFFF'); // Hell-Modus Farbe
      }
    });
  }
